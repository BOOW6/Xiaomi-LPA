name: Release

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse version from update.json
        id: parse_version
        run: |
          VERSION=$(jq -r '.version' update.json)
          VERSION_CODE=$(jq -r '.versionCode' update.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Package module folder
        run: |
          cd module && zip -r ../Xiaomi-LPA_${{ steps.parse_version.outputs.VERSION_CODE }}.zip .

      - name: Extract current version changelog
        id: extract_changelog
        run: |
          VERSION_CODE="${{ steps.parse_version.outputs.VERSION_CODE }}"
          awk -v code="$VERSION_CODE" '
            BEGIN { found=0; block="" }
            /^# .*\([0-9]+\)/ {
              if (found) exit;
              if ($0 ~ "\\(" code "\\)$") {
                found=1;
                next;
              }
            }
            found {
              if ($0 ~ /^---$/) exit;
              block = block $0 "\n"
            }
            END { printf "%s", block }
          ' changelog.md > current_changelog.md

          if [ ! -s current_changelog.md ]; then
            echo "No changelog content for version $VERSION_CODE." > current_changelog.md
          fi

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse_version.outputs.VERSION_CODE }}
          name: ${{ steps.parse_version.outputs.VERSION }} (${{ steps.parse_version.outputs.VERSION_CODE }})
          body_path: current_changelog.md
          files: Xiaomi-LPA_${{ steps.parse_version.outputs.VERSION_CODE }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
